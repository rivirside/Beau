<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Adaptive strength training. Everything stays on your phone." />
    <title>Beau</title>
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <style>
      html, body { margin: 0; background: #000; color: #fff;
        font: 17px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      #boot { display: none; padding: 22vh 24px 0; text-align: center; }
      #boot h1 { font-size: 20px; margin: 0 0 8px; }
      #boot p { color: #8e8e93; font-size: 15px; margin: 0 0 20px; }
      #boot button { font: inherit; font-weight: 600; color: #fff; background: #0a84ff;
        border: 0; border-radius: 12px; padding: 15px 22px; width: 100%; max-width: 320px; }
      #boot pre { display: none; text-align: left; white-space: pre-wrap; word-break: break-word;
        background: #1c1c1e; color: #ff9f0a; font-size: 12px; line-height: 1.4; padding: 12px;
        border-radius: 10px; margin: 0 0 20px; max-height: 34vh; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Recovery shell.
         The service worker serves a precached index.html for every navigation.
         When several deploys land in quick succession, that cached shell can
         point at a hashed script the server has already replaced, so the HTML
         loads and the script 404s: a white screen with no way back, because the
         in-app "Reload latest" button lives inside the app that will not start.
         This runs before any module, heals once automatically, and if that
         fails offers a button. It never touches IndexedDB — training data is
         not a cache. -->
    <div id="boot">
      <h1 id="boot-title">Beau could not start</h1>
      <p id="boot-msg">Something went wrong while loading.</p>
      <pre id="boot-detail"></pre>
      <button id="boot-fix" type="button">Reset cached files and reload</button>
    </div>

    <script>
      (function () {
        var KEY = 'beau-heal-attempted'
        var ERR = 'beau-last-error'
        var healing = false

        function record(text) {
          try { sessionStorage.setItem(ERR, String(text).slice(0, 600)) } catch (e) {}
        }

        function clearShell() {
          var steps = []
          if (navigator.serviceWorker) {
            steps.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister() }))
            }))
          }
          if (window.caches) {
            steps.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k) }))
            }))
          }
          return Promise.all(steps)['catch'](function () {})
        }

        function reload() {
          location.replace(location.pathname + '?heal=' + Date.now())
        }

        function heal(reason, detail) {
          if (healing) return
          healing = true
          if (detail) record(detail)
          var tried
          try { tried = sessionStorage.getItem(KEY) } catch (e) { tried = null }
          // Only a stale cache is worth clearing. A script that loads and then
          // throws will throw again, so clearing storage repeatedly is just a
          // loop that hides the real error.
          if (tried || reason === 'runtime') { showFallback(reason); return }
          try { sessionStorage.setItem(KEY, reason) } catch (e) {}
          clearShell().then(reload)
        }

        function showFallback(reason) {
          var stored
          try { stored = sessionStorage.getItem(ERR) } catch (e) { stored = null }
          var msg = document.getElementById('boot-msg')
          var detail = document.getElementById('boot-detail')
          var fix = document.getElementById('boot-fix')
          if (reason === 'runtime') {
            msg.textContent = 'The app loaded but crashed while starting. This is a bug, not your device — the error below says what happened.'
            fix.textContent = 'Try again'
          } else {
            msg.textContent = "The app's files could not be loaded. Resetting the cache keeps every workout you have logged."
          }
          if (stored) { detail.textContent = stored; detail.style.display = 'block' }
          document.getElementById('boot').style.display = 'block'
        }

        // A module that fails to parse or throws on execution is the likeliest
        // cause, and the one a cache reset can never fix.
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            heal('asset', 'Failed to load ' + (t.src || t.href))
          } else if (e.message) {
            heal('runtime', e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''))
          }
        }, true)

        window.addEventListener('unhandledrejection', function (e) {
          heal('runtime', 'Unhandled rejection: ' + (e.reason && e.reason.message || e.reason))
        })

        setTimeout(function () {
          var app = document.getElementById('app')
          if (!app || app.childElementCount === 0) heal('timeout', 'The app never rendered.')
        }, 10000)

        window.__beauMounted = function () {
          try { sessionStorage.removeItem(KEY); sessionStorage.removeItem(ERR) } catch (e) {}
        }

        document.getElementById('boot-fix').addEventListener('click', function () {
          try { sessionStorage.removeItem(KEY) } catch (e) {}
          clearShell().then(reload)
        })
      })()
    </script>

    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
